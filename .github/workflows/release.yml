name: Build Release (Artifacts Only)

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
      - "!nightly"
      - "!nightly*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build_release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: potato-windows-x86_64.exe
            binary_path: target/release/pumpkin.exe
            cargo_flags: ""
          - os: ubuntu-latest
            artifact_name: potato-linux-x86_64
            binary_path: target/x86_64-unknown-linux-musl/release/pumpkin
            rust_target: x86_64-unknown-linux-musl
            cargo_flags: "--target x86_64-unknown-linux-musl"
          - os: macos-latest
            artifact_name: potato-macos-arm64
            binary_path: target/release/pumpkin
            cargo_flags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove local toolchain override
        shell: bash
        run: rm -f rust-toolchain.toml rust-toolchain

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target || matrix.os }}

      - name: Build Release Binary
        run: cargo build --release -p pumpkin --bin pumpkin ${{ matrix.cargo_flags }}

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cargo build --release -p pumpkin-world --bin worldgen_bench || true
            if [ -f target/release/worldgen_bench.exe ]; then
              cp target/release/worldgen_bench.exe dist/potato-worldgen-bench-windows.exe
            fi
          fi
          ls -la dist/

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          retention-days: 14
